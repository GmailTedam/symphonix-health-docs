<!--
  Symphonix Health — Favicon (32×32)
  Simplified for extreme small sizes. Bolder strokes, fewer details.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 8 72 96" width="32" height="32">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"    stop-color="#FF3B30"/>
      <stop offset="20%"   stop-color="#FF9500"/>
      <stop offset="40%"   stop-color="#34C759"/>
      <stop offset="60%"   stop-color="#00BCD4"/>
      <stop offset="80%"   stop-color="#007AFF"/>
      <stop offset="100%"  stop-color="#AF52DE"/>
    </linearGradient>
  </defs>

  <!-- Shield (simplified) -->
  <path d="M60,12 L92,24 L92,52 C92,76 60,100 60,100 C60,100 28,76 28,52 L28,24 Z"
        fill="url(#shieldGrad)" stroke="#4338CA" stroke-width="2"/>

  <!-- Rainbow pulse (simplified, bolder) -->
  <path d="M38,54 L48,54 L52,52 L57,34 L60,68 L63,42 L68,54 L82,54"
        fill="none" stroke="url(#rainbowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Healthcare cross (slightly larger for visibility) -->
  <rect x="56" y="78" width="8" height="16" rx="1.5" fill="#EEF2FF" opacity="0.9"/>
  <rect x="52" y="82" width="16" height="8" rx="1.5" fill="#EEF2FF" opacity="0.9"/>
</svg>
