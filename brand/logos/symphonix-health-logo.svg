<!--
  ═══════════════════════════════════════════════════════════════════════════════
  Symphonix Health — Primary Logo Lockup
  ═══════════════════════════════════════════════════════════════════════════════

  CANVAS:   400 × 120 px
  BRAND:    Indigo-violet primary + rainbow pulse signature
  USAGE:    Website header, documentation, presentations

  The rainbow ECG pulse inside the shield is the signature brand element —
  it represents the harmony ("symphonix") of healthcare systems working
  together, visualized as a vital sign waveform spanning the full spectrum.
  ─────────────────────────────────────────────────────────────────────────────
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Primary gradient — indigo-violet shield -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#4F46E5;stop-opacity:1"/>   <!-- brand-600 (indigo) -->
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1"/>   <!-- brand-500 -->
    </linearGradient>

    <!-- Overlay gradient — decorative wireframe lines -->
    <linearGradient id="overlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#EEF2FF;stop-opacity:0.9"/> <!-- brand-50  -->
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:0.7"/> <!-- brand-100 -->
    </linearGradient>

    <!-- Node/accent gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#A5B4FC;stop-opacity:1"/>   <!-- brand-300 -->
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:1"/>   <!-- brand-400 -->
    </linearGradient>

    <!-- ★ Signature element — Rainbow gradient for ECG pulse -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"    stop-color="#FF3B30"/>
      <stop offset="14%"   stop-color="#FF9500"/>
      <stop offset="28%"   stop-color="#FFCC00"/>
      <stop offset="42%"   stop-color="#34C759"/>
      <stop offset="57%"   stop-color="#00BCD4"/>
      <stop offset="71%"   stop-color="#007AFF"/>
      <stop offset="85%"   stop-color="#5856D6"/>
      <stop offset="100%"  stop-color="#AF52DE"/>
    </linearGradient>

    <!-- Subtle glow behind the pulse for depth -->
    <filter id="pulseGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 1: Shield container                                             -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <path d="M60,12 L92,24 L92,52 C92,76 60,100 60,100 C60,100 28,76 28,52 L28,24 Z"
        fill="url(#shieldGrad)" stroke="#4338CA" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 2: Inner icon — Rainbow ECG Pulse (Symphonix signature)         -->
  <!--          Safe area: 44×44 circle centred at (60, 52)                  -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->

  <!-- Subtle circular boundary hint -->
  <circle cx="60" cy="52" r="22" fill="none" stroke="url(#overlayGrad)" stroke-width="0.6" opacity="0.3"/>

  <!-- Horizontal baseline guides (subtle) -->
  <line x1="38" y1="52" x2="82" y2="52" stroke="url(#overlayGrad)" stroke-width="0.5" opacity="0.25"/>

  <!-- ★ THE PULSE — Rainbow ECG waveform, the hero element -->
  <path d="M38,54 L44,54 L46,50 L48,54 L51,54 L55,52 L57,34 L60,68 L63,42 L65,54 L69,54 L72,48 L74,52 L78,54 L82,54"
        fill="none" stroke="url(#rainbowGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#pulseGlow)"/>

  <!-- White hero dot at the peak of the R-wave -->
  <circle cx="57" cy="34" r="3" fill="#fff" stroke="#007AFF" stroke-width="1.2" opacity="0.9"/>

  <!-- Small accent nodes at key waveform points -->
  <circle cx="60" cy="68" r="2" fill="url(#nodeGrad)" stroke="#fff" stroke-width="0.8" opacity="0.8"/>
  <circle cx="63" cy="42" r="2" fill="url(#nodeGrad)" stroke="#fff" stroke-width="0.8" opacity="0.8"/>

  <!-- End inner icon -->

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 3: Domain badge — Healthcare cross at shield base               -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="57" y="78" width="6"  height="14" rx="1" fill="#EEF2FF" opacity="0.85"/>
  <rect x="53" y="82" width="14" height="6"  rx="1" fill="#EEF2FF" opacity="0.85"/>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 4: Wordmark                                                     -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->

  <!-- Project name -->
  <text x="120" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="4" fill="#4F46E5">
    SYMPHONIX
  </text>

  <!-- Accent line -->
  <line x1="120" y1="64" x2="340" y2="64" stroke="#6366F1" stroke-width="1" opacity="0.4"/>

  <!-- Subtitle line 1 -->
  <text x="121" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="9" font-weight="400" letter-spacing="1.8" fill="#7B7BA0">
    INTELLIGENT HEALTHCARE
  </text>

  <!-- Subtitle line 2 -->
  <text x="121" y="91" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="9" font-weight="400" letter-spacing="1.8" fill="#7B7BA0">
    INFRASTRUCTURE
  </text>
</svg>
